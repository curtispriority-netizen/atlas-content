name: Atlas research

'on':
  push:
    branches:
      - codex/atlas-background-research
  pull_request:
    paths:
      - .github/workflows/research.yml
      - scripts/**
      - tests/**
      - schema/**
      - APPRAISAL.md
      - CARD_STYLE.md
  workflow_dispatch:
    inputs:
      mode:
        description: Tests use fixtures. Stage uses the APIs and saves drafts privately. Promote publishes cards you approved.
        type: choice
        options: [test, stage, promote]
        default: test
      promote_ids:
        description: For promote only. Comma-separated 12-character fingerprints from the review files.
        type: string
      retry_holds:
        description: Revisit held inputs and recompute failed appraisals
        type: boolean
        default: false
      benchmark_pmid:
        description: Optional PMID to stage a single public paper privately
        type: string
  schedule:
    - cron: '23 7 * * 3'
      timezone: Australia/Hobart

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/research-requirements.txt
      - run: python -m unittest discover -s tests && python scripts/validate.py

  research:
    needs: test
    if: >-
      !cancelled() && github.repository == 'curtispriority-netizen/atlas-content' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.mode == 'stage' || inputs.mode == 'promote') &&
      needs.test.result == 'success') ||
      (github.event_name == 'schedule' && vars.ATLAS_STAGE_SCHEDULE == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: atlas-research
    concurrency:
      group: atlas-research
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.mode == 'promote' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install and check
        run: |
          python -m pip install -r scripts/research-requirements.txt
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          python -m unittest discover -s tests
          python scripts/validate.py
      - name: Check that the audit repository is private
        env:
          GH_TOKEN: ${{ secrets.ATLAS_STATE_TOKEN }}
          STATE_REPO: ${{ vars.ATLAS_STATE_REPO }}
        run: |
          [[ "$STATE_REPO" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$(gh api "repos/$STATE_REPO" --jq '.visibility')" == private ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.ATLAS_STATE_REPO }}
          token: ${{ secrets.ATLAS_STATE_TOKEN }}
          ref: main
          path: .atlas-state
      - name: Run Atlas
        id: atlas
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATLAS_DRIVE_READER_JSON: ${{ secrets.ATLAS_DRIVE_READER_JSON }}
          ATLAS_DRIVE_FOLDER_ID: ${{ vars.ATLAS_DRIVE_FOLDER_ID }}
          ATLAS_RUN_MICRO_USD: ${{ vars.ATLAS_RUN_MICRO_USD }}
          ATLAS_MONTH_MICRO_USD: ${{ vars.ATLAS_MONTH_MICRO_USD }}
          ATLAS_PUBLISH_ENABLED: ${{ vars.ATLAS_PUBLISH_ENABLED }}
          RETRY_HOLDS: ${{ inputs.retry_holds }}
          MODE_INPUT: ${{ inputs.mode }}
          PROMOTE_IDS: ${{ inputs.promote_ids }}
          BENCHMARK_PMID: ${{ inputs.benchmark_pmid }}
        run: |
          git config user.name 'Atlas research'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .atlas-state config user.name 'Atlas research'
          git -C .atlas-state config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mode=stage
          extra=()
          if [[ "$MODE_INPUT" == promote ]]; then
            mode=promote
            extra+=(--promote-ids "$PROMOTE_IDS")
          fi
          if [[ "$RETRY_HOLDS" == true ]]; then extra+=(--retry-holds); fi
          if [[ "$mode" == stage && -n "$BENCHMARK_PMID" ]]; then
            extra+=(--benchmark-pmid "$BENCHMARK_PMID")
          fi
          python scripts/research.py "$mode" --state .atlas-state "${extra[@]}"
      - name: Notify about published research
        if: >-
          !cancelled() && steps.atlas.outputs.published != '' &&
          vars.ATLAS_PUBLICATION_NOTICES == 'true'
        env:
          GH_TOKEN: ${{ secrets.ATLAS_STATE_TOKEN }}
          STATE_REPO: ${{ vars.ATLAS_STATE_REPO }}
          PUBLICATION: ${{ steps.atlas.outputs.published }}
        run: |
          [[ "$PUBLICATION" =~ ^[a-f0-9]{40}$ ]]
          title="Atlas research published (${PUBLICATION:0:12})"
          existing="$(gh issue list -R "$STATE_REPO" --state all --search "in:title \"$title\"" --json title --jq ".[].title")"
          if ! grep -Fxq "$title" <<< "$existing"; then
            gh issue create -R "$STATE_REPO" --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body "Clinician-approved, AI-drafted research was published to Atlas via promote. Not independently verified by a second reader. https://github.com/$GITHUB_REPOSITORY/commit/$PUBLICATION" >/dev/null
          fi
